<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t-memory-tradeoff d-memory-tradeoff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<title id="t-memory-tradeoff">GDDR6 memory tuning — tiny gain, brick cliff</title>
<desc id="d-memory-tradeoff">Clock and timings add very little FPS, and one bad value can permanently brick the board. bandwidth / FPS gain: 30, 40, 48, 52. brick risk: 20, 45, 70, 100. 1950 MHz is where boards came back bricked.</desc>
<rect width="1200" height="640" rx="18" fill="#0d1117"/>
<rect x="1" y="1" width="1198" height="638" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>
<text x="150" y="66" font-size="38" font-weight="700" fill="#e6edf3">GDDR6 memory tuning — tiny gain, brick cliff</text>
<text x="150" y="102" font-size="21" fill="#8b949e">Clock and timings add very little FPS, and one bad value can permanently brick the</text>
<text x="150" y="132" font-size="21" fill="#8b949e">board.</text>
<rect x="150" y="150" width="330" height="320" fill="#1f6feb" opacity="0.14"/>
<text x="315" y="184" text-anchor="middle" font-size="20" font-weight="600" fill="#58a6ff">some boards run 1800 @ 860 mV</text>
<line x1="150" y1="470" x2="1140" y2="470" stroke="#21262d" stroke-width="2"/>
<text x="130" y="478" text-anchor="end" font-size="20" fill="#8b949e">0</text>
<line x1="150" y1="390" x2="1140" y2="390" stroke="#21262d" stroke-width="2"/>
<text x="130" y="398" text-anchor="end" font-size="20" fill="#8b949e">25</text>
<line x1="150" y1="310" x2="1140" y2="310" stroke="#21262d" stroke-width="2"/>
<text x="130" y="318" text-anchor="end" font-size="20" fill="#8b949e">50</text>
<line x1="150" y1="230" x2="1140" y2="230" stroke="#21262d" stroke-width="2"/>
<text x="130" y="238" text-anchor="end" font-size="20" fill="#8b949e">75</text>
<line x1="150" y1="150" x2="1140" y2="150" stroke="#21262d" stroke-width="2"/>
<text x="130" y="158" text-anchor="end" font-size="20" fill="#8b949e">100</text>
<text transform="translate(46 310) rotate(-90)" text-anchor="middle" font-size="20" fill="#6e7681">relative, %</text>
<polyline points="150,374 480,342 810,316.4 1140,303.6" fill="none" stroke="#58a6ff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="150" cy="374" r="7" fill="#58a6ff"/>
<circle cx="480" cy="342" r="7" fill="#58a6ff"/>
<circle cx="810" cy="316.4" r="7" fill="#58a6ff"/>
<circle cx="1140" cy="303.6" r="7" fill="#58a6ff"/>
<polyline points="150,406 480,326 810,246 1140,150" fill="none" stroke="#f0883e" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="144" y="400" width="12" height="12" fill="#f0883e"/>
<rect x="474" y="320" width="12" height="12" fill="#f0883e"/>
<rect x="804" y="240" width="12" height="12" fill="#f0883e"/>
<rect x="1134" y="144" width="12" height="12" fill="#f0883e"/>
<line x1="150" y1="470" x2="1140" y2="470" stroke="#30363d" stroke-width="3"/>
<text x="150" y="506" text-anchor="start" font-size="21" fill="#e6edf3">1750</text>
<text x="480" y="506" text-anchor="middle" font-size="21" fill="#e6edf3">1800</text>
<text x="810" y="506" text-anchor="middle" font-size="21" fill="#e6edf3">1875</text>
<text x="1140" y="506" text-anchor="end" font-size="21" fill="#e6edf3">1950</text>
<text x="645" y="538" text-anchor="middle" font-size="20" fill="#6e7681">memory clock, MHz (stock 1750)</text>
<circle cx="158" cy="572" r="7" fill="#58a6ff"/>
<text x="176" y="578" font-size="21" fill="#e6edf3">bandwidth / FPS gain</text>
<rect x="406" y="566" width="12" height="12" fill="#f0883e"/>
<text x="430" y="578" font-size="21" fill="#e6edf3">brick risk</text>
<text x="150" y="616" font-size="19" fill="#f0883e">1950 MHz is where boards came back bricked.</text>
</svg>
