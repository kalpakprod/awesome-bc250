<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="Segoe UI,Arial,sans-serif">
<rect width="560" height="340" fill="#0d1117"/>
<text x="280.0" y="26" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">GDDR6 memory tuning — tiny gain, brick cliff</text>
<text x="280.0" y="44" fill="#8b949e" font-size="11" text-anchor="middle">clock/timings add little FPS but a bad value can permanently brick the board</text>
<line x1="80" y1="260.0" x2="500" y2="260.0" stroke="#30363d" stroke-width="1"/>
<text x="72" y="264.0" fill="#8b949e" font-size="10" text-anchor="end">0</text>
<line x1="80" y1="210.0" x2="500" y2="210.0" stroke="#30363d" stroke-width="1"/>
<text x="72" y="214.0" fill="#8b949e" font-size="10" text-anchor="end">25</text>
<line x1="80" y1="160.0" x2="500" y2="160.0" stroke="#30363d" stroke-width="1"/>
<text x="72" y="164.0" fill="#8b949e" font-size="10" text-anchor="end">50</text>
<line x1="80" y1="110.0" x2="500" y2="110.0" stroke="#30363d" stroke-width="1"/>
<text x="72" y="114.0" fill="#8b949e" font-size="10" text-anchor="end">75</text>
<line x1="80" y1="60.0" x2="500" y2="60.0" stroke="#30363d" stroke-width="1"/>
<text x="72" y="64.0" fill="#8b949e" font-size="10" text-anchor="end">100</text>
<line x1="220.0" y1="60" x2="220.0" y2="260" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="80" y1="260" x2="500" y2="260" stroke="#8b949e" stroke-width="1.5"/>
<text x="80.0" y="278.0" fill="#c9d1d9" font-size="11" text-anchor="middle">1750</text>
<text x="220.0" y="278.0" fill="#c9d1d9" font-size="11" text-anchor="middle">1800</text>
<text x="360.0" y="278.0" fill="#c9d1d9" font-size="11" text-anchor="middle">1875</text>
<text x="500.0" y="278.0" fill="#c9d1d9" font-size="11" text-anchor="middle">1950</text>
<text x="290.0" y="296.0" fill="#8b949e" font-size="10" text-anchor="middle">MHz (stock 1750)</text>
<polyline points="80.0,200.0 220.0,180.0 360.0,164.0 500.0,156.0" fill="none" stroke="#3fb950" stroke-width="3"/><circle cx="80.0" cy="200.0" r="4" fill="#3fb950"/><circle cx="220.0" cy="180.0" r="4" fill="#3fb950"/><circle cx="360.0" cy="164.0" r="4" fill="#3fb950"/><circle cx="500.0" cy="156.0" r="4" fill="#3fb950"/>
<polyline points="80.0,220.0 220.0,170.0 360.0,120.0 500.0,60.0" fill="none" stroke="#f85149" stroke-width="3"/><circle cx="80.0" cy="220.0" r="4" fill="#f85149"/><circle cx="220.0" cy="170.0" r="4" fill="#f85149"/><circle cx="360.0" cy="120.0" r="4" fill="#f85149"/><circle cx="500.0" cy="60.0" r="4" fill="#f85149"/>
<rect x="80" y="314" width="12" height="12" fill="#3fb950"/><text x="98" y="324" fill="#c9d1d9" font-size="11">bandwidth / FPS gain</text>
<rect x="250" y="314" width="12" height="12" fill="#f85149"/><text x="268" y="324" fill="#c9d1d9" font-size="11">BRICK risk</text>
<text x="220.0" y="58.0" fill="#3fb950" font-size="10" text-anchor="middle">some run 1800 @ 860 mV</text>
<text x="500" y="324" fill="#f0883e" font-size="10" text-anchor="end">1950 = bricked boards</text>
</svg>