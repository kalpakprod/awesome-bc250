<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t-idle-power-tradeoff d-idle-power-tradeoff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<title id="t-idle-power-tradeoff">Idle power — you can cut the GPU, not the total</title>
<desc id="d-idle-power-tradeoff">Governor and undervolt drop the GPU, but CPU and GDDR6 stay fixed, so wall draw barely moves until suspend. GPU draw: 80, 50, 29, 5. total wall draw: 125, 118, 110, 10. High-leakage batches floor around 70–80 W; suspend reaches ~10 W.</desc>
<rect width="1200" height="640" rx="18" fill="#0d1117"/>
<rect x="1" y="1" width="1198" height="638" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>
<text x="150" y="66" font-size="38" font-weight="700" fill="#e6edf3">Idle power — you can cut the GPU, not the total</text>
<text x="150" y="102" font-size="21" fill="#8b949e">Governor and undervolt drop the GPU, but CPU and GDDR6 stay fixed, so wall draw</text>
<text x="150" y="132" font-size="21" fill="#8b949e">barely moves until suspend.</text>
<line x1="150" y1="470" x2="1140" y2="470" stroke="#21262d" stroke-width="2"/>
<text x="130" y="478" text-anchor="end" font-size="20" fill="#8b949e">0</text>
<line x1="150" y1="390" x2="1140" y2="390" stroke="#21262d" stroke-width="2"/>
<text x="130" y="398" text-anchor="end" font-size="20" fill="#8b949e">33</text>
<line x1="150" y1="310" x2="1140" y2="310" stroke="#21262d" stroke-width="2"/>
<text x="130" y="318" text-anchor="end" font-size="20" fill="#8b949e">65</text>
<line x1="150" y1="230" x2="1140" y2="230" stroke="#21262d" stroke-width="2"/>
<text x="130" y="238" text-anchor="end" font-size="20" fill="#8b949e">98</text>
<line x1="150" y1="150" x2="1140" y2="150" stroke="#21262d" stroke-width="2"/>
<text x="130" y="158" text-anchor="end" font-size="20" fill="#8b949e">130</text>
<text transform="translate(46 310) rotate(-90)" text-anchor="middle" font-size="20" fill="#6e7681">watts at the wall</text>
<polyline points="150,273.0769230769231 480,346.9230769230769 810,398.61538461538464 1140,457.6923076923077" fill="none" stroke="#58a6ff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
