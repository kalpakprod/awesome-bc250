<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="Segoe UI,Arial,sans-serif">
<rect width="600" height="350" fill="#0d1117"/>
<text x="300.0" y="26" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">Idle power — you can cut the GPU, not the total</text>
<text x="300.0" y="45" fill="#8b949e" font-size="11" text-anchor="middle">governor/undervolt drop the GPU, but CPU + GDDR6 stay fixed, so wall draw barely moves until suspend</text>
<line x1="90" y1="264.0" x2="540" y2="264.0" stroke="#30363d"/>
<text x="82" y="268.0" fill="#8b949e" font-size="10" text-anchor="end">0</text>
<line x1="90" y1="214.0" x2="540" y2="214.0" stroke="#30363d"/>
<text x="82" y="218.0" fill="#8b949e" font-size="10" text-anchor="end">32</text>
<line x1="90" y1="164.0" x2="540" y2="164.0" stroke="#30363d"/>
<text x="82" y="168.0" fill="#8b949e" font-size="10" text-anchor="end">65</text>
<line x1="90" y1="114.0" x2="540" y2="114.0" stroke="#30363d"/>
<text x="82" y="118.0" fill="#8b949e" font-size="10" text-anchor="end">98</text>
<line x1="90" y1="64.0" x2="540" y2="64.0" stroke="#30363d"/>
<text x="82" y="68.0" fill="#8b949e" font-size="10" text-anchor="end">130</text>
<text x="20" y="164" fill="#8b949e" font-size="10" text-anchor="middle" transform="rotate(-90 20 164)">Watts (at the wall)</text>
<line x1="90" y1="264" x2="540" y2="264" stroke="#8b949e" stroke-width="1.5"/>
<text x="90.0" y="282.0" fill="#c9d1d9" font-size="11" text-anchor="middle">stock</text>
<text x="240.0" y="282.0" fill="#c9d1d9" font-size="11" text-anchor="middle">+governor</text>
<text x="390.0" y="282.0" fill="#c9d1d9" font-size="11" text-anchor="middle">+700mV UV</text>
<text x="540.0" y="282.0" fill="#c9d1d9" font-size="11" text-anchor="middle">+auto-suspend</text>
<text x="315.0" y="300.0" fill="#8b949e" font-size="10" text-anchor="middle">tuning applied</text>
<polyline points="90.0,140.9 240.0,187.1 390.0,219.4 540.0,256.3" fill="none" stroke="#3fb950" stroke-width="3"/>
<circle cx="90.0" cy="140.9" r="4" fill="#3fb950"/>
<circle cx="240.0" cy="187.1" r="4" fill="#3fb950"/>
<circle cx="390.0" cy="219.4" r="4" fill="#3fb950"/>
<circle cx="540.0" cy="256.3" r="4" fill="#3fb950"/>
<polyline points="90.0,71.7 240.0,82.5 390.0,94.8 540.0,248.6" fill="none" stroke="#f85149" stroke-width="3"/>
<circle cx="90.0" cy="71.7" r="4" fill="#f85149"/>
<circle cx="240.0" cy="82.5" r="4" fill="#f85149"/>
<circle cx="390.0" cy="94.8" r="4" fill="#f85149"/>
<circle cx="540.0" cy="248.6" r="4" fill="#f85149"/>
<rect x="90" y="326" width="12" height="12" fill="#3fb950"/><text x="107" y="336" fill="#c9d1d9" font-size="11">GPU draw</text>
<rect x="186" y="326" width="12" height="12" fill="#f85149"/><text x="203" y="336" fill="#c9d1d9" font-size="11">total wall draw</text>
<text x="315" y="60" fill="#8b949e" font-size="10" text-anchor="middle">CPU pstates uncontrollable + GDDR6 ~constant</text>
<text x="540" y="320" fill="#f0883e" font-size="10" text-anchor="end">high-leakage batches floor ~70-80W; suspend ~10W</text>
</svg>