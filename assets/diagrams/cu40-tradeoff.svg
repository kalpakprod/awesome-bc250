<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="Segoe UI,Arial,sans-serif">
<rect width="600" height="350" fill="#0d1117"/>
<text x="300.0" y="26" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">40-CU unlock — big compute gain, tiny gaming gain</text>
<text x="300.0" y="45" fill="#8b949e" font-size="11" text-anchor="middle">more CUs help compute a lot, games barely (CPU-bound) — and the last CUs are a lottery</text>
<line x1="90" y1="264.0" x2="540" y2="264.0" stroke="#30363d"/>
<text x="82" y="268.0" fill="#8b949e" font-size="10" text-anchor="end">0</text>
<line x1="90" y1="214.0" x2="540" y2="214.0" stroke="#30363d"/>
<text x="82" y="218.0" fill="#8b949e" font-size="10" text-anchor="end">25</text>
<line x1="90" y1="164.0" x2="540" y2="164.0" stroke="#30363d"/>
<text x="82" y="168.0" fill="#8b949e" font-size="10" text-anchor="end">50</text>
<line x1="90" y1="114.0" x2="540" y2="114.0" stroke="#30363d"/>
<text x="82" y="118.0" fill="#8b949e" font-size="10" text-anchor="end">75</text>
<line x1="90" y1="64.0" x2="540" y2="64.0" stroke="#30363d"/>
<text x="82" y="68.0" fill="#8b949e" font-size="10" text-anchor="end">100</text>
<text x="20" y="164" fill="#8b949e" font-size="10" text-anchor="middle" transform="rotate(-90 20 164)">relative</text>
<line x1="90" y1="264" x2="540" y2="264" stroke="#8b949e" stroke-width="1.5"/>
<text x="90.0" y="282.0" fill="#c9d1d9" font-size="11" text-anchor="middle">24</text>
<text x="240.0" y="282.0" fill="#c9d1d9" font-size="11" text-anchor="middle">36</text>
<text x="390.0" y="282.0" fill="#c9d1d9" font-size="11" text-anchor="middle">38</text>
<text x="540.0" y="282.0" fill="#c9d1d9" font-size="11" text-anchor="middle">40</text>
<text x="315.0" y="300.0" fill="#8b949e" font-size="10" text-anchor="middle">active CUs (stock 24)</text>
<polyline points="90.0,184.0 240.0,124.0 390.0,104.0 540.0,84.0" fill="none" stroke="#3fb950" stroke-width="3"/>
<circle cx="90.0" cy="184.0" r="4" fill="#3fb950"/>
<circle cx="240.0" cy="124.0" r="4" fill="#3fb950"/>
<circle cx="390.0" cy="104.0" r="4" fill="#3fb950"/>
<circle cx="540.0" cy="84.0" r="4" fill="#3fb950"/>
<polyline points="90.0,184.0 240.0,176.0 390.0,172.0 540.0,170.0" fill="none" stroke="#d29922" stroke-width="3" stroke-dasharray="6 4"/>
<circle cx="90.0" cy="184.0" r="4" fill="#d29922"/>
<circle cx="240.0" cy="176.0" r="4" fill="#d29922"/>
<circle cx="390.0" cy="172.0" r="4" fill="#d29922"/>
<circle cx="540.0" cy="170.0" r="4" fill="#d29922"/>
<polyline points="90.0,214.0 240.0,154.0 390.0,120.0 540.0,64.0" fill="none" stroke="#f85149" stroke-width="3"/>
<circle cx="90.0" cy="214.0" r="4" fill="#f85149"/>
<circle cx="240.0" cy="154.0" r="4" fill="#f85149"/>
<circle cx="390.0" cy="120.0" r="4" fill="#f85149"/>
<circle cx="540.0" cy="64.0" r="4" fill="#f85149"/>
<rect x="90" y="326" width="12" height="12" fill="#3fb950"/><text x="107" y="336" fill="#c9d1d9" font-size="11">compute (e.g. Superposition)</text>
<rect x="326" y="326" width="12" height="12" fill="#d29922"/><text x="343" y="336" fill="#c9d1d9" font-size="11">gaming FPS</text>
<rect x="436" y="326" width="12" height="12" fill="#f85149"/><text x="453" y="336" fill="#c9d1d9" font-size="11">power + instability</text>
<text x="387" y="60" fill="#d29922" font-size="10" text-anchor="middle">38 = typical stable max</text>
<text x="540" y="320" fill="#f85149" font-size="10" text-anchor="end">40 = lottery: artifacts/crash; needs &gt;300W (J2000) + AIO</text>
</svg>