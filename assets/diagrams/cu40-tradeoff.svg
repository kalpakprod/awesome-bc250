<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t-cu40-tradeoff d-cu40-tradeoff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<title id="t-cu40-tradeoff">40-CU unlock — big compute gain, tiny gaming gain</title>
<desc id="d-cu40-tradeoff">More CUs help compute a lot and games barely, because games are CPU-bound; the last CUs are a lottery. compute (Superposition): 40, 70, 80, 90. gaming FPS: 40, 44, 46, 47. power + instability: 25, 55, 72, 100. 40 CU is a lottery: artifacts and crashes; needs &gt;300 W (J2000) and an AIO.</desc>
