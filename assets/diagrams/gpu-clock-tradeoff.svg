<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="Segoe UI,Arial,sans-serif">
<rect width="560" height="340" fill="#0d1117"/>
<text x="280.0" y="26" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">GPU core clock — gain vs cost</text>
<text x="280.0" y="44" fill="#8b949e" font-size="11" text-anchor="middle">more clock = more FPS, but it flattens (CPU-bound) while heat/power climb</text>
<line x1="80" y1="260.0" x2="500" y2="260.0" stroke="#30363d" stroke-width="1"/>
<text x="72" y="264.0" fill="#8b949e" font-size="10" text-anchor="end">0</text>
<line x1="80" y1="210.0" x2="500" y2="210.0" stroke="#30363d" stroke-width="1"/>
<text x="72" y="214.0" fill="#8b949e" font-size="10" text-anchor="end">25</text>
<line x1="80" y1="160.0" x2="500" y2="160.0" stroke="#30363d" stroke-width="1"/>
<text x="72" y="164.0" fill="#8b949e" font-size="10" text-anchor="end">50</text>
<line x1="80" y1="110.0" x2="500" y2="110.0" stroke="#30363d" stroke-width="1"/>
<text x="72" y="114.0" fill="#8b949e" font-size="10" text-anchor="end">75</text>
<line x1="80" y1="60.0" x2="500" y2="60.0" stroke="#30363d" stroke-width="1"/>
<text x="72" y="64.0" fill="#8b949e" font-size="10" text-anchor="end">100</text>
<line x1="395.0" y1="60" x2="395.0" y2="260" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="80" y1="260" x2="500" y2="260" stroke="#8b949e" stroke-width="1.5"/>
<text x="80.0" y="278.0" fill="#c9d1d9" font-size="11" text-anchor="middle">1500</text>
<text x="185.0" y="278.0" fill="#c9d1d9" font-size="11" text-anchor="middle">1600</text>
<text x="290.0" y="278.0" fill="#c9d1d9" font-size="11" text-anchor="middle">1800</text>
<text x="395.0" y="278.0" fill="#c9d1d9" font-size="11" text-anchor="middle">2000</text>
<text x="500.0" y="278.0" fill="#c9d1d9" font-size="11" text-anchor="middle">2230</text>
<text x="290.0" y="296.0" fill="#8b949e" font-size="10" text-anchor="middle">MHz</text>
<polyline points="80.0,180.0 185.0,150.0 290.0,100.0 395.0,70.0 500.0,64.0" fill="none" stroke="#3fb950" stroke-width="3"/><circle cx="80.0" cy="180.0" r="4" fill="#3fb950"/><circle cx="185.0" cy="150.0" r="4" fill="#3fb950"/><circle cx="290.0" cy="100.0" r="4" fill="#3fb950"/><circle cx="395.0" cy="70.0" r="4" fill="#3fb950"/><circle cx="500.0" cy="64.0" r="4" fill="#3fb950"/>
<polyline points="80.0,210.0 185.0,194.0 290.0,150.0 395.0,110.0 500.0,70.0" fill="none" stroke="#f85149" stroke-width="3"/><circle cx="80.0" cy="210.0" r="4" fill="#f85149"/><circle cx="185.0" cy="194.0" r="4" fill="#f85149"/><circle cx="290.0" cy="150.0" r="4" fill="#f85149"/><circle cx="395.0" cy="110.0" r="4" fill="#f85149"/><circle cx="500.0" cy="70.0" r="4" fill="#f85149"/>
<rect x="80" y="314" width="12" height="12" fill="#3fb950"/><text x="98" y="324" fill="#c9d1d9" font-size="11">FPS gain</text>
<rect x="250" y="314" width="12" height="12" fill="#f85149"/><text x="268" y="324" fill="#c9d1d9" font-size="11">power + heat</text>
<text x="395.0" y="58.0" fill="#3fb950" font-size="10" text-anchor="middle">sweet spot ~2000 MHz (+30% FPS)</text>
<text x="500" y="324" fill="#f0883e" font-size="10" text-anchor="end">quiet ~1600</text>
</svg>