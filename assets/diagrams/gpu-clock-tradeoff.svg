<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t-gpu-clock-tradeoff d-gpu-clock-tradeoff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<title id="t-gpu-clock-tradeoff">GPU core clock — gain vs cost</title>
<desc id="d-gpu-clock-tradeoff">More clock means more FPS, but the curve flattens once the CPU limits it, while heat and power keep climbing. FPS gain: 40, 55, 80, 95, 98. power + heat: 25, 33, 55, 75, 95. Quiet target is around 1600 MHz.</desc>
<rect width="1200" height="640" rx="18" fill="#0d1117"/>
<rect x="1" y="1" width="1198" height="638" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>
<text x="150" y="66" font-size="38" font-weight="700" fill="#e6edf3">GPU core clock — gain vs cost</text>
<text x="150" y="102" font-size="21" fill="#8b949e">More clock means more FPS, but the curve flattens once the CPU limits it, while</text>
<text x="150" y="132" font-size="21" fill="#8b949e">heat and power keep climbing.</text>
<rect x="892.5" y="150" width="247.5" height="320" fill="#1f6feb" opacity="0.14"/>
<text x="1010" y="448" text-anchor="middle" font-size="20" font-weight="600" fill="#58a6ff">sweet spot ~2000 MHz, about +30% FPS</text>
<line x1="150" y1="470" x2="1140" y2="470" stroke="#21262d" stroke-width="2"/>
<text x="130" y="478" text-anchor="end" font-size="20" fill="#8b949e">0</text>
<line x1="150" y1="390" x2="1140" y2="390" stroke="#21262d" stroke-width="2"/>
<text x="130" y="398" text-anchor="end" font-size="20" fill="#8b949e">25</text>
<line x1="150" y1="310" x2="1140" y2="310" stroke="#21262d" stroke-width="2"/>
<text x="130" y="318" text-anchor="end" font-size="20" fill="#8b949e">50</text>
<line x1="150" y1="230" x2="1140" y2="230" stroke="#21262d" stroke-width="2"/>
<text x="130" y="238" text-anchor="end" font-size="20" fill="#8b949e">75</text>
<line x1="150" y1="150" x2="1140" y2="150" stroke="#21262d" stroke-width="2"/>
<text x="130" y="158" text-anchor="end" font-size="20" fill="#8b949e">100</text>
<text transform="translate(46 310) rotate(-90)" text-anchor="middle" font-size="20" fill="#6e7681">relative, %</text>
<polyline points="150,342 397.5,294 645,214 892.5,166 1140,156.39999999999998" fill="none" stroke="#58a6ff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="150" cy="342" r="7" fill="#58a6ff"/>
<circle cx="397.5" cy="294" r="7" fill="#58a6ff"/>
<circle cx="645" cy="214" r="7" fill="#58a6ff"/>
<circle cx="892.5" cy="166" r="7" fill="#58a6ff"/>
<circle cx="1140" cy="156.39999999999998" r="7" fill="#58a6ff"/>
<polyline points="150,390 397.5,364.4 645,294 892.5,230 1140,166" fill="none" stroke="#f0883e" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="144" y="384" width="12" height="12" fill="#f0883e"/>
<rect x="391.5" y="358.4" width="12" height="12" fill="#f0883e"/>
<rect x="639" y="288" width="12" height="12" fill="#f0883e"/>
<rect x="886.5" y="224" width="12" height="12" fill="#f0883e"/>
<rect x="1134" y="160" width="12" height="12" fill="#f0883e"/>
<line x1="150" y1="470" x2="1140" y2="470" stroke="#30363d" stroke-width="3"/>
<text x="150" y="506" text-anchor="start" font-size="21" fill="#e6edf3">1500</text>
<text x="397.5" y="506" text-anchor="middle" font-size="21" fill="#e6edf3">1600</text>
<text x="645" y="506" text-anchor="middle" font-size="21" fill="#e6edf3">1800</text>
<text x="892.5" y="506" text-anchor="middle" font-size="21" fill="#e6edf3">2000</text>
<text x="1140" y="506" text-anchor="end" font-size="21" fill="#e6edf3">2230</text>
<text x="645" y="538" text-anchor="middle" font-size="20" fill="#6e7681">GPU core clock, MHz</text>
<circle cx="158" cy="572" r="7" fill="#58a6ff"/>
<text x="176" y="578" font-size="21" fill="#e6edf3">FPS gain</text>
<rect x="274" y="566" width="12" height="12" fill="#f0883e"/>
<text x="298" y="578" font-size="21" fill="#e6edf3">power + heat</text>
<text x="150" y="616" font-size="19" fill="#f0883e">Quiet target is around 1600 MHz.</text>
</svg>
